<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Planner V7.8</title>

    <!-- QUILL CSS -->
<link href="planner/quill.snow.css" rel="stylesheet">

<style>
    /* --- THEME VARIABLES --- */
    :root {
        --primary: #6366f1;       
        --primary-soft: #e0e7ff;
        --bg-body: #f1f5f9;       
        --surface: #ffffff;
        --text-main: #334155;     
        --text-sub: #94a3b8;      
        --border: #cbd5e1;
        
        --danger: #f43f5e;
        --success: #10b981;
        --warn: #f59e0b;
        --skip: #64748b;
        
        --shadow-float: 0 10px 40px -5px rgba(0,0,0,0.15);
        --shadow-card: 0 2px 4px rgba(0,0,0,0.04);
        
        --font-stack: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* GLOBAL STYLES */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
    
    /* --- KEYBOARD FIX (VERY IMPORTANT) --- */
    /* এই অংশটি কিবোর্ড ওপেন করতে সাহায্য করে */
    input, textarea, .ql-editor, .ql-editor * {
        user-select: text !important;
        -webkit-user-select: text !important;
        cursor: text;
    }

    body {
        font-family: var(--font-stack);
        background: var(--bg-body); 
        color: var(--text-main);
        height: 100vh; width: 100vw; margin: 0;
        overflow: hidden; display: flex; flex-direction: column;
    }

    /* --- HEADER (Conflict Free) --- */
    header {
        height: 54px; background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 12px; z-index: 20; position: relative;
    }

    .header-left { 
        display: flex; align-items: center; gap: 8px; z-index: 5; flex: 1;
    }

    .view-toggle {
        width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--bg-body); color: var(--text-main); display: grid; place-items: center; cursor: pointer;
        flex-shrink: 0;
    }
    .view-toggle.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Smart Clock */
    .clock-widget {
        display: flex; flex-direction: column; align-items: center;
        line-height: 1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        white-space: nowrap;
    }
    .clock-widget.centered {
        position: absolute; left: 50%; transform: translateX(-50%);
        align-items: center;
    }
    .clock-widget.mini-left {
        position: relative; transform: none; 
        align-items: flex-start; cursor: pointer;
        background: var(--primary-soft); padding: 4px 8px; border-radius: 6px;
    }
    .clock-widget.mini-left .cw-time { color: var(--primary); font-size: 0.8rem; }
    .clock-widget.mini-left .cw-date { display: none; } 
    .clock-widget.mini-left::after { content: 'Return'; font-size: 0.55rem; color: var(--primary); font-weight: 700; }

    .cw-time { font-size: 0.95rem; font-weight: 800; color: var(--text-main); }
    .cw-date { font-size: 0.65rem; font-weight: 600; color: var(--text-sub); margin-top: 2px;}

    /* Center Title */
    .center-title {
        position: absolute; left: 0; right: 0; text-align: center;
        font-size: 1rem; font-weight: 800; color: var(--text-main);
        opacity: 0; transition: opacity 0.3s; pointer-events: none;
        z-index: 1; padding: 0 60px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .center-title.visible { opacity: 1; }

    /* Nav Buttons */
    .nav-group { display: flex; gap: 2px; align-items: center; z-index: 5; flex-shrink: 0; }
    .nav-btn { 
        width: 30px; height: 30px; border-radius: 6px;
        background: transparent; border: none; 
        font-size: 1.2rem; color:var(--text-main); cursor:pointer; 
        display: grid; place-items: center;
    }
    .nav-btn:active { background: var(--bg-body); }

    /* --- CALENDAR --- */
    main { flex: 1; padding: 0; overflow: hidden; display:flex; flex-direction:column; }
    
    .cal-grid { 
        display: grid; 
        grid-template-columns: repeat(7, 1fr); 
        grid-auto-rows: minmax(70px, auto); 
        gap: 1px;
        overflow-y: auto; 
        height: 100%; 
        align-content: start;
        background: var(--border); 
        padding: 1px;
    }
    
    .day-head {
        background: var(--surface); position: sticky; top: 0; z-index: 10;
        text-align: center; font-size: 0.55rem; font-weight: 800; color: var(--text-sub);
        padding: 6px 0; border-bottom: 1px solid var(--border);
    }
    
    .day {
        background: var(--surface); padding: 4px;
        display: flex; flex-direction: column; gap: 3px; cursor: pointer;
        position: relative;
    }
    .day.today { background: #f8fafc; }
    .day.today .date-num { background: var(--primary); color: #fff; }
    
    .date-num { 
        font-size: 0.7rem; font-weight: 700; color: var(--text-sub); 
        margin-left: auto; width: 20px; height: 20px; 
        display: grid; place-items: center; border-radius: 5px;
    }
    
    /* Chips & Indicators */
    .pin-chip {
        font-size: 0.6rem; font-weight: 600; padding: 2px 4px;
        border-radius: 3px; background: var(--primary-soft); color: var(--primary);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        border-left: 2px solid var(--primary); display: block;
    }
    .pin-chip.is-late { background: #fee2e2; color: var(--danger); border-color: var(--danger); }
    
    .indicator-row { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; margin-top: auto; }
    .idx-pill { font-size: 0.55rem; font-weight: 700; padding: 1px 4px; border-radius: 8px; }
    .idx-p { background: #e0e7ff; color: #4f46e5; }
    .idx-t { background: #dcfce7; color: #15803d; }
    .idx-n { background: #fef3c7; color: #b45309; }
    
    .mini-dots { display: flex; gap: 2px; justify-content: flex-end; }
    .m-dot { width: 4px; height: 4px; border-radius: 50%; }

    /* --- PREMIUM PANEL --- */
    .overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.15); backdrop-filter: blur(4px);
        opacity: 0; pointer-events: none; transition: 0.3s; z-index: 50;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    
    .sheet {
        position: absolute; bottom: 0; left: 0; right: 0; height: 75vh; 
        background: var(--surface); border-radius: 20px 20px 0 0; 
        display: flex; flex-direction: column;
        transform: translateY(110%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), height 0.3s;
        box-shadow: var(--shadow-float); overflow: hidden;
    }
    .sheet.full-mode { height: 95vh; }
    .overlay.active .sheet { transform: translateY(0); }

    .sh-head { 
        padding: 10px 16px; border-bottom: 1px solid var(--border); 
        display: flex; justify-content: space-between; align-items: center; 
        background: var(--surface); z-index: 5;
    }
    
    .color-picker { display: flex; gap: 8px; }
    .cp-dot { 
        width: 18px; height: 18px; border-radius: 50%; cursor: pointer; 
        border: 2px solid #fff; box-shadow: 0 0 0 1px #ddd;
    }

    .tabs { display: flex; padding: 0 16px; gap: 16px; border-bottom: 1px solid var(--border); margin-top: 5px;}
    .tab { 
        padding: 12px 0; border: none; background: transparent; 
        color: var(--text-sub); font-weight: 700; font-size: 0.85rem; 
        cursor: pointer; position: relative; 
    }
    .tab.active { color: var(--primary); }
    .tab.active::after { 
        content:''; position: absolute; bottom: -1px; left: 0; right: 0; 
        height: 3px; background: var(--primary); border-radius: 3px; 
    }

    .filter-bar {
        display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; border-bottom: 1px solid var(--border);
    }
    .f-chip {
        padding: 4px 10px; border-radius: 20px; background: var(--bg-body); 
        color: var(--text-sub); font-size: 0.7rem; font-weight: 700; border: 1px solid transparent; cursor: pointer;
    }
    .f-chip.active { background: var(--text-main); color: #fff; }

    .sh-body { flex: 1; overflow-y: auto; padding: 10px 16px 80px 16px; }

    /* Cards */
    .card { 
        background: #fff; padding: 12px; border-radius: 12px; margin-bottom: 10px; 
        border: 1px solid var(--border); box-shadow: var(--shadow-card);
        display: flex; gap: 10px; align-items: flex-start;
    }
    .card-check {
        width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
        flex-shrink: 0; margin-top: 2px; cursor: pointer; display: grid; place-items: center;
    }
    .card.done .card-check { background: var(--success); border-color: var(--success); }
    .card.skip .card-check { border-color: var(--skip); background: var(--bg-body); }
    
    .card-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .card-txt { 
        font-size: 0.95rem; font-weight: 600; color: var(--text-main); 
        white-space: pre-wrap; word-break: break-word; line-height: 1.4;
    }
    .card.done .card-txt { text-decoration: line-through; opacity: 0.5; }
    .card-footer { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; font-weight: 700; color: var(--text-sub); }
    .badge-time { display: flex; align-items: center; gap: 3px; background: var(--bg-body); padding: 2px 6px; border-radius: 4px; }
    .badge-timer { color: var(--primary); }

    /* --- COMPACT & PRETTY PICKERS --- */
    .picker-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100;
        display: none; align-items: center; justify-content: center; backdrop-filter: blur(3px);
    }
    .picker-overlay.open { display: flex; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
    
    .tp-card {
        background: #fff; width: 260px; padding: 15px; border-radius: 18px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .tp-header { text-align: center; font-weight: 800; color: var(--text-main); margin-bottom: 10px; font-size: 1rem; }
    
    .tp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 160px; }
    .tp-col { overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 2px; }
    .tp-col::-webkit-scrollbar { width: 3px; }
    .tp-col::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
    
    .tp-btn {
        padding: 6px; border-radius: 6px; border: 1px solid transparent; background: #f8fafc;
        font-weight: 600; font-size: 0.85rem; cursor: pointer; text-align: center; transition: 0.1s;
    }
    .tp-btn.active { background: var(--primary); color: white; box-shadow: 0 2px 5px rgba(99, 102, 241, 0.3); }
    
    .tp-actions { margin-top: 12px; display: flex; gap: 8px; }
    .tp-act-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
    .tp-save { background: var(--primary); color: white; }
    .tp-close { background: #e2e8f0; color: var(--text-main); }

    /* --- CUSTOM DELETE CONFIRMATION --- */
    .confirm-card {
        background: #fff; width: 240px; padding: 20px; border-radius: 16px;
        text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }
    .conf-title { font-size: 1rem; font-weight: 700; color: var(--text-main); margin-bottom: 5px; }
    .conf-sub { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 15px; }
    .conf-btns { display: flex; gap: 10px; }
    .conf-btn { 
        flex: 1; padding: 10px; border-radius: 8px; border: none; 
        font-weight: 700; cursor: pointer; font-size: 0.9rem; 
    }
    .conf-yes { background: var(--danger); color: white; }
    .conf-no { background: #f1f5f9; color: var(--text-main); }


    /* --- EDITOR & DOCS --- */
    .edit-row { 
        background: #fff; border: 1px solid var(--border); padding: 10px; 
        border-radius: 10px; margin-bottom: 10px; display:flex; gap:8px; align-items:center;
    }
    .btn-time-trig {
        background: var(--bg-body); border: 1px solid var(--border); padding: 8px 12px;
        border-radius: 8px; font-weight: 700; color: var(--primary); cursor: pointer;
        min-width: 80px; text-align: center;
    }
    .inp-flat { 
        border: 1px solid #eee; background: var(--bg-body); padding: 8px; 
        border-radius: 6px; flex: 1; font-family: inherit; font-size: 0.95rem;
    }

    /* --- QUILL FIXED STYLES (KEYBOARD + TOOLBAR) --- */
    .editor-container { 
        background: #fff; 
        border: 1px solid var(--border); 
        border-radius: 10px; 
        overflow: hidden; 
        display: flex; 
        flex-direction: column; 
        height: 350px; 
        position: relative;
    }

    /* Toolbar Specific Fixes */
    .ql-toolbar.ql-snow {
        border: none !important; 
        border-bottom: 1px solid var(--border) !important;
        background: var(--bg-body); 
        flex-shrink: 0; 
        width: 100%;    
        z-index: 5;    
        display: block !important; 
        padding: 8px !important;
    }

    /* Editor Area Fixes */
    .ql-container.ql-snow {
        border: none !important; 
        font-family: var(--font-stack) !important; 
        font-size: 1rem; 
        flex: 1;        
        overflow-y: hidden; 
    }
    
    .ql-editor { 
        padding: 15px; 
        color: var(--text-main); 
        line-height: 1.6;
        height: 100%;
        overflow-y: auto;
    }

    /* Fix Icons Visibility */
    .ql-snow .ql-stroke { stroke: var(--text-main) !important; }
    .ql-snow .ql-fill { fill: var(--text-main) !important; }
    .ql-snow .ql-picker { color: var(--text-main) !important; }
    
    .ql-editor img { max-width: 100%; height: auto; border-radius: 6px; }


    /* Stickers */
    .sticker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sticker { 
        padding: 15px; border-radius: 10px; font-size: 0.9rem; 
        box-shadow: var(--shadow-card); position: relative; word-break: break-word; 
        max-height: 200px; overflow-y: auto; background: #fff;
    }
    .sticker img { max-width: 100%; height: auto; border-radius: 4px; display: block; margin: 5px 0; }
    .sticker::-webkit-scrollbar { width: 4px; }
    .sticker::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }

    .add-fab {
        position: absolute; bottom: 20px; right: 20px; width: 48px; height: 48px;
        background: var(--text-main); color: white; border-radius: 50%; border: none;
        font-size: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); cursor: pointer; z-index: 10;
    }

</style>
</head>
<body>

<svg style="display:none;">
    <symbol id="icon-layer" viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></symbol>
    <symbol id="icon-full" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="white"/></symbol>
    <symbol id="icon-cal" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z" fill="currentColor"/></symbol>
</svg>

<header>
    <div class="header-left">
        <button class="view-toggle" id="viewTog" onclick="toggleViewMode()"><svg style="width:18px;height:18px;fill:currentColor"><use href="#icon-layer"/></svg></button>
        <div class="clock-widget centered" id="smartClock" onclick="goToToday()">
            <div class="cw-time" id="headTime">--:--</div>
            <div class="cw-date" id="headDate">-- --</div>
        </div>
    </div>

    <!-- Center Title (Now safer) -->
    <div class="center-title" id="centerTitle"></div>

    <div class="nav-group">
        <button class="nav-btn" onclick="moveMonth(-1)">‹</button>
        <button class="nav-btn picker-btn" onclick="openDatePicker()">
            <svg style="width:20px;height:20px"><use href="#icon-cal"/></svg>
        </button>
        <button class="nav-btn" onclick="moveMonth(1)">›</button>
    </div>
</header>

<main>
    <div class="cal-grid" id="grid"></div>
</main>

<!-- TIME PICKER -->
<div class="picker-overlay" id="timePicker">
    <div class="tp-card">
        <div class="tp-header">Select Time</div>
        <div class="tp-grid">
            <div class="tp-col" id="tpHours"></div>
            <div class="tp-col" id="tpMins"></div>
        </div>
        <div class="tp-actions">
            <button class="tp-act-btn tp-close" onclick="closeTimePicker()">Cancel</button>
            <button class="tp-act-btn tp-save" onclick="saveTimePicker()">Save</button>
        </div>
    </div>
</div>

<!-- DATE PICKER -->
<div class="picker-overlay" id="datePicker">
    <div class="tp-card">
        <div class="tp-header">Jump to Date</div>
        <div class="tp-grid">
            <div class="tp-col" id="dpMonths"></div>
            <div class="tp-col" id="dpYears"></div>
        </div>
        <div class="tp-actions">
            <button class="tp-act-btn tp-close" onclick="closeDatePicker()">Cancel</button>
            <button class="tp-act-btn tp-save" onclick="saveDatePicker()">Go</button>
        </div>
    </div>
</div>

<!-- CUSTOM CONFIRM OVERLAY -->
<div class="picker-overlay" id="confirmOverlay">
    <div class="confirm-card">
        <div class="conf-title">Delete Item?</div>
        <div class="conf-sub">This action cannot be undone.</div>
        <div class="conf-btns">
            <button class="conf-btn conf-no" onclick="closeConfirm()">No</button>
            <button class="conf-btn conf-yes" onclick="confirmYes()">Yes</button>
        </div>
    </div>
</div>

<div class="overlay" id="overlay">
    <div class="sheet" id="sheetCard">
        <div class="sh-head">
            <div class="color-picker">
                <div class="cp-dot" style="background:#ffffff" onclick="setBoxColor('#ffffff')"></div>
                <div class="cp-dot" style="background:#fefce8" onclick="setBoxColor('#fefce8')"></div>
                <div class="cp-dot" style="background:#f0fdf4" onclick="setBoxColor('#f0fdf4')"></div>
                <div class="cp-dot" style="background:#eff6ff" onclick="setBoxColor('#eff6ff')"></div>
                <div class="cp-dot" style="background:#fdf2f8" onclick="setBoxColor('#fdf2f8')"></div>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="nav-btn" onclick="toggleFullSheet()"><svg style="width:16px;height:16px;fill:#555"><use href="#icon-full"/></svg></button>
                <button class="nav-btn" onclick="closeSheet()"><svg style="width:16px;height:16px;fill:#555"><use href="#icon-close"/></svg></button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="setTab('pin')">Pins</button>
            <button class="tab" onclick="setTab('task')">Tasks</button>
            <button class="tab" onclick="setTab('note')">Docs</button>
        </div>

        <!-- Task Filters -->
        <div class="filter-bar" id="taskFilters" style="display:none;">
            <div class="f-chip active" onclick="setTaskFilter('all', this)">All</div>
            <div class="f-chip" onclick="setTaskFilter('pending', this)">Active</div>
            <div class="f-chip" onclick="setTaskFilter('done', this)">Done</div>
            <div class="f-chip" onclick="setTaskFilter('skip', this)">Skip</div>
        </div>

        <div class="sh-body" id="sheetBody"></div>

        <button class="add-fab" onclick="toggleEdit()" id="fabBtn">+</button>
    </div>
</div>

<!-- QUILL JS -->
<script src="planner/quill.js"></script>

<script>
    

let db = {}; // ডাটাবেস লোড হওয়ার আগ পর্যন্ত খালি থাকবে
let idb; // IndexedDB ইনস্ট্যান্স
const DB_NAME = 'ProPlannerDB';
let viewDate = new Date();

    let selKey = null;
    let curTab = 'pin';
    let taskFilter = 'all';
    let isEdit = false;
    let compactMode = localStorage.getItem('compactMode') === 'true';

    let quill = null;

    // Picker States
    let tpTarget = { type: null, index: null };
    let tpSel = { h: '12', m: '00' };
    let dpSel = { m: 0, y: 2025 };

    // Delete State
    let pendingDelete = { type: null, index: null };

    function init() {
        renderCal();
        updateViewToggle();
        buildTimePicker();
        buildDatePicker();
        setInterval(() => {
            updateClock();
            const today = new Date();
            if(viewDate.getMonth() === today.getMonth() && viewDate.getFullYear() === today.getFullYear()) {
                renderCal();
            }
            if(selKey && !isEdit) renderSheet(); 
        }, 60000); 
        updateClock();
    }

    function updateClock() {
        const n = new Date();
        document.getElementById('headTime').innerText = n.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        document.getElementById('headDate').innerText = n.toLocaleDateString([], {month:'short', day:'numeric'});
    }

    // --- NAVIGATION ---
    function updateHeaderState() {
        const today = new Date();
        const isCurrent = viewDate.getMonth() === today.getMonth() && viewDate.getFullYear() === today.getFullYear();
        
        const clock = document.getElementById('smartClock');
        const title = document.getElementById('centerTitle');
        
        if(isCurrent) {
            clock.className = 'clock-widget centered';
            title.classList.remove('visible');
        } else {
            clock.className = 'clock-widget mini-left';
            title.innerText = viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            title.classList.add('visible');
        }
    }

    function goToToday() { viewDate = new Date(); renderCal(); }

    function toggleViewMode() {
        compactMode = !compactMode;
        localStorage.setItem('compactMode', compactMode);
        updateViewToggle();
        renderCal();
    }
    
    function updateViewToggle() {
        const btn = document.getElementById('viewTog');
        if(compactMode) btn.classList.add('active');
        else btn.classList.remove('active');
    }

    function getRelTime(isoDate, timeStr) {
        if(!timeStr) return null;
        const target = new Date(`${isoDate}T${timeStr}`);
        const now = new Date();
        const diff = target - now;
        const mins = Math.ceil(diff / 60000);
        
        if(diff < -60000) return { txt: "Late", class: "late" };
        if(diff <= 60000 && diff > -60000) return { txt: "Now", class: "" };
        if(mins < 60) return { txt: `in ${mins}m`, class: "" };
        const h = Math.floor(mins/60);
        const m = mins%60;
        return { txt: `in ${h}h ${m>0?m+'m':''}`, class: "" };
    }

    // --- CALENDAR RENDER ---
    function renderCal() {
        const y = viewDate.getFullYear(), m = viewDate.getMonth();
        updateHeaderState(); 

        const grid = document.getElementById('grid'); grid.innerHTML = '';
        
        ['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach(d => {
            const h = document.createElement('div'); h.className='day-head'; h.innerText=d; grid.appendChild(h);
        });

        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m+1, 0).getDate();
        const todayKey = new Date().toISOString().split('T')[0];

        for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));

        for(let i=1; i<=daysInMonth; i++) {
            const dObj = new Date(y, m, i);
            const key = dObj.toISOString().split('T')[0];
            if(!db[key]) db[key] = {bg:'#ffffff', pins:[], tasks:[], notes:[]};
            const d = db[key];
            
            const cell = document.createElement('div');
            cell.className = 'day';
            if(key === todayKey) cell.classList.add('today');
            cell.style.background = d.bg !== '#ffffff' ? d.bg : '';
            cell.onclick = () => openSheet(key, dObj);

            let html = `<div class="date-num">${i}</div>`;
            
            if(compactMode) {
                html += `<div class="indicator-row">`;
                if(d.pins.length) html += `<div class="idx-pill idx-p">${d.pins.length}p</div>`;
                const activeT = d.tasks.filter(t=>t.status!=='done'&&t.status!=='skip').length;
                if(activeT) html += `<div class="idx-pill idx-t">${activeT}t</div>`;
                if(d.notes.length) html += `<div class="idx-pill idx-n">${d.notes.length}d</div>`;
                html += `</div>`;
            } else {
                d.pins.forEach(pin => {
                    let displayText = pin.txt;
                    let chipClass = '';
                    if(pin.time) {
                        const rel = getRelTime(key, pin.time);
                        displayText = `<b>${rel.txt}</b> ${pin.txt}`;
                        if(rel.class === 'late') chipClass = 'is-late';
                    }
                    html += `<div class="pin-chip ${chipClass}">${displayText}</div>`;
                });
                const activeT = d.tasks.filter(t => t.status !== 'done' && t.status !== 'skip').length;
                if(activeT || d.notes.length) {
                    html += `<div class="mini-dots">`;
                    if(activeT) html += `<div class="m-dot" style="background:var(--success)"></div>`;
                    if(d.notes.length) html += `<div class="m-dot" style="background:var(--warn)"></div>`;
                    html += `</div>`;
                }
            }

            cell.innerHTML = html;
            grid.appendChild(cell);
        }
    }

    function moveMonth(n) { viewDate.setMonth(viewDate.getMonth()+n); renderCal(); }

    // --- TIME PICKER ---
    function buildTimePicker() {
        const hBox = document.getElementById('tpHours');
        const mBox = document.getElementById('tpMins');
        for(let i=0; i<24; i++) {
            const val = i.toString().padStart(2,'0');
            hBox.innerHTML += `<div class="tp-btn" onclick="tpSelect('h', '${val}', this)">${val}</div>`;
        }
        for(let i=0; i<60; i+=5) {
            const val = i.toString().padStart(2,'0');
            mBox.innerHTML += `<div class="tp-btn" onclick="tpSelect('m', '${val}', this)">${val}</div>`;
        }
    }
    function tpSelect(type, val, el) {
        if(type === 'h') tpSel.h = val; else tpSel.m = val;
        const parent = type==='h'?document.getElementById('tpHours'):document.getElementById('tpMins');
        Array.from(parent.children).forEach(c => c.classList.remove('active'));
        el.classList.add('active');
    }
    function openTimePicker(type, index) {
        tpTarget = { type, index };
        const curr = db[selKey][type==='pin'?'pins':'tasks'][index].time;
        if(curr) { const [h, m] = curr.split(':'); tpSel = { h, m }; }
        document.getElementById('timePicker').classList.add('open');
    }
    function closeTimePicker() { document.getElementById('timePicker').classList.remove('open'); }
    function saveTimePicker() {
        updItem(tpTarget.type, tpTarget.index, 'time', `${tpSel.h}:${tpSel.m}`);
        closeTimePicker(); renderSheet();
    }

    // --- DATE PICKER (UNLIMITED) ---
    function buildDatePicker() {
        const mBox = document.getElementById('dpMonths');
        const yBox = document.getElementById('dpYears');
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        
        months.forEach((m, i) => {
            mBox.innerHTML += `<div class="tp-btn" onclick="dpSelect('m', ${i}, this)">${m}</div>`;
        });
        
        // Generate years 1900 to 2100 (Effective unlimited for planner)
        for(let i=1900; i<=2100; i++) {
            yBox.innerHTML += `<div class="tp-btn" id="yr-${i}" onclick="dpSelect('y', ${i}, this)">${i}</div>`;
        }
    }

    function dpSelect(type, val, el) {
        if(type === 'm') dpSel.m = val; else dpSel.y = val;
        const parent = type==='m'?document.getElementById('dpMonths'):document.getElementById('dpYears');
        Array.from(parent.children).forEach(c => c.classList.remove('active'));
        el.classList.add('active');
    }

    function openDatePicker() {
        dpSel.m = viewDate.getMonth();
        dpSel.y = viewDate.getFullYear();
        
        const mBox = document.getElementById('dpMonths');
        const yBox = document.getElementById('dpYears');
        
        Array.from(mBox.children).forEach((c, i) => c.classList.toggle('active', i === dpSel.m));
        
        // Handle Year Scrolling
        Array.from(yBox.children).forEach(c => c.classList.remove('active'));
        const yrBtn = document.getElementById(`yr-${dpSel.y}`);
        if(yrBtn) {
            yrBtn.classList.add('active');
            yrBtn.scrollIntoView({block:'center'});
        }

        document.getElementById('datePicker').classList.add('open');
    }

    function closeDatePicker() { document.getElementById('datePicker').classList.remove('open'); }
    function saveDatePicker() {
        viewDate = new Date(dpSel.y, dpSel.m, 1);
        renderCal();
        closeDatePicker();
    }

    // --- CUSTOM DELETE CONFIRM ---
    function delItem(type, index) {
        pendingDelete = { type, index };
        document.getElementById('confirmOverlay').classList.add('open');
    }

    function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('open'); }

    function confirmYes() {
        const { type, index } = pendingDelete;
        if(type==='note') db[selKey].notes.splice(index,1);
        else db[selKey][type==='pin'?'pins':'tasks'].splice(index,1);
        renderSheet();
        closeConfirm();
    }

    // --- SHEET LOGIC ---
    function openSheet(key, dateObj) {
        selKey = key; isEdit = false;
        document.getElementById('sheetCard').style.background = db[selKey].bg;
        document.getElementById('overlay').classList.add('active');
        document.getElementById('fabBtn').innerText = "+";
        
        if(db[selKey].pins.length) setTab('pin'); else if(db[selKey].tasks.length) setTab('task'); else setTab('pin');
    }

    function closeSheet() {
        document.getElementById('overlay').classList.remove('active');
        document.getElementById('sheetCard').classList.remove('full-mode');
        isEdit = false; quill = null;
        saveDB(); renderCal();
    }

    function toggleFullSheet() { document.getElementById('sheetCard').classList.toggle('full-mode'); }
    function setBoxColor(c) { db[selKey].bg = c; document.getElementById('sheetCard').style.background = c; saveDB(); }
    
    function toggleEdit() {
        isEdit = !isEdit;
        document.getElementById('fabBtn').innerText = isEdit ? "✓" : "+";
        renderSheet();
    }

    function setTab(t) {
        curTab = t;
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(t.replace('note','doc'))));
        document.getElementById('taskFilters').style.display = (t === 'task' && !isEdit) ? 'flex' : 'none';
        renderSheet();
    }

    function setTaskFilter(f, el) {
        taskFilter = f;
        document.querySelectorAll('.f-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        renderSheet();
    }

    function renderSheet() {
        const box = document.getElementById('sheetBody'); 
        const data = db[selKey];

        if(isEdit) {
            document.getElementById('taskFilters').style.display = 'none';
            box.innerHTML = ''; 

            if(curTab === 'note') {
                box.innerHTML = `
                <div class="editor-container">
                    <div id="quillEditor"></div>
                </div>
                <button onclick="addSticker()" style="margin-top:10px; width:100%; background:var(--primary); color:#fff; padding:12px; border:none; border-radius:8px; font-weight:700; cursor:pointer; box-shadow:0 4px 6px rgba(0,0,0,0.1);">Save Note</button>
                <div class="sticker-grid" style="margin-top:20px;">
                    ${data.notes.map((n,i) => `<div class="sticker" style="background:${n.bg}"><button style="position:absolute;right:5px;top:5px;background:rgba(0,0,0,0.1);color:#333;border:none;cursor:pointer;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;" onclick="delItem('note',${i})">×</button>${n.html}</div>`).join('')}
                </div>`;

                quill = new Quill('#quillEditor', {
                    theme: 'snow',
                    placeholder: 'Type your note here...',
                    modules: {
                        toolbar: [
                            [{ 'header': [1, 2, false] }],
                            ['bold', 'italic', 'underline', 'strike'],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            [{ 'color': [] }, { 'background': [] }],
                            ['link', 'image'],
                            ['clean']
                        ]
                    }
                });
                return;
            }

            const list = curTab === 'pin' ? data.pins : data.tasks;
            list.forEach((item, i) => {
                box.innerHTML += `
                <div class="edit-row">
                    <button class="btn-time-trig" onclick="openTimePicker('${curTab}', ${i})">${item.time || 'Set Time'}</button>
                    <textarea class="inp-flat" rows="2" onchange="updItem('${curTab}',${i},'txt',this.value)">${item.txt}</textarea>
                    <button onclick="delItem('${curTab}', ${i})" style="color:var(--danger);background:#fff;border:1px solid #eee;padding:8px;border-radius:6px;">Del</button>
                </div>`;
            });
            box.innerHTML += `<button style="width:100%;padding:15px;border:2px dashed #ddd;color:#aaa;border-radius:12px;background:none;font-weight:700;" onclick="addItem('${curTab}')">Add Item</button>`;
        } else {
            box.innerHTML = '';
            
            if(curTab === 'note') {
                box.innerHTML = `<div class="sticker-grid">` + 
                data.notes.map(n => `<div class="sticker" style="background:${n.bg}">${n.html}</div>`).join('') + `</div>`;
                return;
            }

            let list = curTab === 'pin' ? data.pins : data.tasks;
            if(curTab === 'task') {
                list = list.map((item, idx) => ({...item, oIdx: idx}));
                if(taskFilter !== 'all') {
                    if(taskFilter === 'pending') list = list.filter(i => !i.status || i.status === 'pending');
                    else list = list.filter(i => i.status === taskFilter);
                }
            }

            if(!list.length) box.innerHTML = `<div style="text-align:center;color:var(--text-sub);margin-top:40px;">No items</div>`;

            list.forEach((item) => {
                const status = item.status || 'pending';
                const rel = getRelTime(selKey, item.time);
                
                let checkHTML = '';
                if(curTab === 'task') {
                    checkHTML = `<div class="card-check" onclick="toggleTask(${item.oIdx})"><svg style="width:14px;display:${status==='done'?'block':'none'}"><use href="#icon-check"/></svg></div>`;
                } else {
                    checkHTML = `<div style="width:4px;height:40px;background:${rel && rel.class==='late' ? 'var(--danger)' : 'var(--primary)'};border-radius:2px;"></div>`;
                }

                let timeHTML = '';
                if(item.time) {
                    timeHTML = `
                    <div class="card-footer">
                        <div class="badge-time">${item.time}</div>
                        <div class="badge-time badge-timer ${rel.class}">• ${rel.txt}</div>
                    </div>`;
                }

                box.innerHTML += `
                <div class="card ${status}">
                    ${checkHTML}
                    <div class="card-content">
                        <div class="card-txt">${item.txt || 'New Item'}</div>
                        ${timeHTML}
                    </div>
                    ${curTab === 'task' ? `<button onclick="skipTask(${item.oIdx})" style="background:none;border:none;color:var(--text-sub);font-size:0.7rem;">Skip</button>` : ''}
                </div>`;
            });
        }
    }

    function addItem(type) { db[selKey][type==='pin'?'pins':'tasks'].push({txt:'', time:'', status:'pending'}); renderSheet(); }
    function updItem(type, idx, f, v) { db[selKey][type==='pin'?'pins':'tasks'][idx][f] = v; }
    
    function toggleTask(idx) {
        const t = db[selKey].tasks[idx];
        t.status = t.status === 'done' ? 'pending' : 'done';
        saveDB(); renderSheet(); renderCal();
    }
    
    function skipTask(idx) {
        const t = db[selKey].tasks[idx];
        t.status = t.status === 'skip' ? 'pending' : 'skip';
        saveDB(); renderSheet(); renderCal();
    }
    
    function addSticker() {
        if(!quill) return;
        const txt = quill.root.innerHTML;
        if(quill.getText().trim().length === 0 && !txt.includes('<img')) {
            alert("Please write something!");
            return;
        }
        const bg = db[selKey].bg !== '#ffffff' ? db[selKey].bg : '#fffbeb';
        db[selKey].notes.push({html:txt, bg:bg}); 
        quill.setContents([]);
        renderSheet();
    }

// নতুন IndexedDB সেভ ফাংশন
    function saveDB() {
        if (!idb) return;
        const tx = idb.transaction(['data'], 'readwrite');
        const store = tx.objectStore('data');
        store.put(db, 'mainStore');
    }

    // নতুন ইনিশিয়ালাইজেশন ফাংশন (DB সেটআপ সহ)
    function init() {
        // ১. IndexedDB ওপেন করা
        const request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains('data')) {
                database.createObjectStore('data');
            }
        };

        request.onsuccess = (e) => {
            idb = e.target.result;
            loadDataAndRender(); // DB কানেক্ট হলে ডেটা লোড শুরু হবে
        };

        request.onerror = (e) => {
            console.error("DB Error:", e);
            // এরর হলে খালি db দিয়ে অ্যাপ চালু হবে
            startApp();
        };
    }

    function loadDataAndRender() {
        const tx = idb.transaction(['data'], 'readonly');
        const store = tx.objectStore('data');
        const req = store.get('mainStore');

        req.onsuccess = () => {
            // যদি আগের ডেটা থাকে তা db তে লোড হবে, না থাকলে খালি অবজেক্ট
            db = req.result || {};
            startApp();
        };
    }

    function startApp() {
        // আগের init() এর লজিকগুলো এখন এখানে রান হবে
        renderCal();
        updateViewToggle();
        buildTimePicker();
        buildDatePicker();
        
        setInterval(() => {
            updateClock();
            const today = new Date();
            if(viewDate.getMonth() === today.getMonth() && viewDate.getFullYear() === today.getFullYear()) {
                renderCal();
            }
            if(selKey && !isEdit) renderSheet(); 
        }, 60000); 
        updateClock();
    }



    init();
</script>
</body>
