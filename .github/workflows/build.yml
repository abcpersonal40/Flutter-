name: Titan Ultimate Bridge Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Initialize Project
        run: |
          flutter create --org com.titanchart --project-name titanchart_pro .

          flutter pub add webview_flutter:^4.7.0
          flutter pub add flutter_foreground_task:^6.5.0
          flutter pub add flutter_local_notifications:^17.0.0
          flutter pub add shared_preferences:^2.2.2
          flutter pub add permission_handler:^11.3.0
          flutter pub add vibration:^1.9.0
          flutter pub add timezone:^0.9.4

      - name: Ensure WWW Assets
        run: |
          echo "Checking www folder"
          if [ ! -d "www" ]; then
            echo "ERROR: www folder missing"
            exit 1
          fi

          echo "WWW FILE STRUCTURE:"
          find www

      - name: Link Assets Correctly
        run: |
          sed -i 's/uses-material-design: true/uses-material-design: true\n  assets:\n    - www\//' pubspec.yaml

      - name: Android Config (Manifest Fix)
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.titanchart.titanchart_pro">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>

              <application
                  android:label="TitanChart Pro"
                  android:name="\${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <meta-data android:name="flutterEmbedding" android:value="2" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name="com.pravera.flutter_foreground_task.service.ForegroundService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false"/>

              </application>

          </manifest>
          EOF

      - name: Inject Bridge Engine
        run: |
          cat > lib/main.dart <<'EOF'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:isolate';
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            runApp(const TitanApp());
          }

          class TitanApp extends StatefulWidget {
            const TitanApp({super.key});

            @override
            State<TitanApp> createState() => _TitanAppState();
          }

          class _TitanAppState extends State<TitanApp> {

            late final WebViewController controller;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF000000))
                ..addJavaScriptChannel(
                  'TitanBridge',
                  onMessageReceived: (message) {
                    print("JS MESSAGE: ${message.message}");
                  },
                )
                ..loadFlutterAsset('www/index.html');
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(controller: controller),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK
        run: |
          keytool -genkey -v \
          -keystore android/app/release-key.jks \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias key \
          -storepass titan123456 \
          -keypass titan123456 \
          -dname "CN=Titan, O=Dev, C=BD"

          echo "storePassword=titan123456" > android/key.properties
          echo "keyPassword=titan123456" >> android/key.properties
          echo "keyAlias=key" >> android/key.properties
          echo "storeFile=release-key.jks" >> android/key.properties

          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Titan-Ultimate-Console
          path: build/app/outputs/flutter-apk/app-release.apk
